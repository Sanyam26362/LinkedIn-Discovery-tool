services:
  - type: web
    name: edxso-discovery-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: APIFY_API_TOKEN
        sync: false
      - key: SERPER_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: SERPER_GL
        value: ""
      - key: CORS_ORIGINS
        value: "*"
      - key: ENABLE_CACHE
        value: "true"
